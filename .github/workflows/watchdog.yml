name: watchdog
# GitHub sometimes skips scheduled runs. This restarts autopost if it has not run for about 75 minutes.
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Restart autopost if it has gone quiet
        run: |
          last=$(gh run list -R "$REPO" -w autopost.yml -L 1 --json createdAt --jq '.[0].createdAt')
          if [ -z "$last" ]; then echo "no autopost run yet, starting one"; gh workflow run autopost.yml -R "$REPO"; exit 0; fi
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "last autopost run: $last ($((age / 60)) min ago)"
          if [ "$age" -gt 4500 ]; then gh workflow run autopost.yml -R "$REPO" && echo "autopost restarted by watchdog"; else echo "autopost is fine"; fi
