name: autopost
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish nothing)"
        type: boolean
        default: false
concurrency:
  group: autopost
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      MIM_KEY: ${{ secrets.MIM_KEY }}
      MIM_URL: ${{ vars.MIM_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
      WHISPER_LANG: ${{ vars.WHISPER_LANG }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for new Facebook posts (cheap)
        id: check
        run: |
          python3 -m pip install --quiet requests
          python3 autopost.py --check
      - name: Cache Whisper model
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}
      - name: Publish new posts
        if: steps.check.outputs.work == 'true'
        run: |
          python3 -m pip install --quiet faster-whisper
          python3 autopost.py
