name: autopost
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish nothing)"
        type: boolean
        default: false
      backfill:
        description: "Backfill: re-check posts that were ignored before"
        type: boolean
        default: false
      redo_drafts:
        description: "Trash unfinished autopost drafts so they are rebuilt properly"
        type: boolean
        default: false
      max_posts:
        description: "Posts to handle in this run (empty = 8)"
        type: string
        default: ""
concurrency:
  group: autopost
  cancel-in-progress: false
permissions:
  contents: read
  actions: write      # only to switch the other timers back on (see the "Keep the timers switched on" step)
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      MIM_KEY: ${{ secrets.MIM_KEY }}
      MIM_URL: ${{ vars.MIM_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
      WHISPER_LANG: ${{ vars.WHISPER_LANG }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      BACKFILL: ${{ inputs.backfill && '1' || '' }}
      MAX_PER_RUN: ${{ inputs.max_posts }}
      REDO_DRAFTS: ${{ inputs.redo_drafts && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep the timers switched on
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # In a public repo GitHub switches scheduled workflows (watchdog, token-check) off after 60 days without a commit.
          # This job is started by cron-job.org, which that rule does not touch, so it switches them back on every time. Harmless when they are already on.
          for w in watchdog.yml token-check.yml autopost.yml; do gh workflow enable "$w" -R "$GITHUB_REPOSITORY" || echo "(could not enable $w)"; done
      - name: Check for new Facebook posts (cheap)
        id: check
        run: |
          python3 -m pip install --quiet requests
          python3 autopost.py --check
      - name: Cache Whisper model
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}
      - name: Publish new posts
        if: steps.check.outputs.work == 'true'
        run: |
          # Ubuntu's package servers are sometimes unreachable for a few minutes (it failed a whole run on 2026-11-19):
          # short timeouts, up to 4 tries with a pause in between, and only then give up.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3 4; do
            if sudo apt-get update -qq $APT && sudo apt-get install -y -qq $APT ffmpeg; then break; fi
            [ "$i" = 4 ] && { echo "ffmpeg could not be installed after 4 tries"; exit 1; }
            echo "apt failed (try $i of 4), waiting before the next try"; sleep $((i * 20))
          done
          ffmpeg -version | head -1
          python3 -m pip install --quiet faster-whisper
          python3 autopost.py
