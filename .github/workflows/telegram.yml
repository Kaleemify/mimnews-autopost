name: telegram-desk
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: telegram-desk
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ALLOWED_IDS: ${{ secrets.TG_ALLOWED_IDS }}
      MIM_KEY: ${{ secrets.MIM_KEY }}
      MIM_URL: ${{ vars.MIM_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
      WHISPER_LANG: ${{ vars.WHISPER_LANG }}
    steps:
      - uses: actions/checkout@v4
      - name: Any new Telegram messages? (cheap)
        id: check
        run: |
          python3 -m pip install --quiet requests
          python3 tg_autopost.py --check
      - name: Cache Whisper model
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}
      - name: Publish
        if: steps.check.outputs.work == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 -m pip install --quiet faster-whisper
          python3 tg_autopost.py
