name: gemini-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Call Gemini once (prints status only, never the key)
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get("GEMINI_API_KEY", "")
          print("key present:", bool(key), "| length:", len(key))
          req = urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", headers={"x-goog-api-key": key})
          try:
              j = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              print("LIST HTTP", e.code, e.read().decode()[:300].replace(key, "<key>")); raise SystemExit(1)
          names = [m["name"].split("/")[-1] for m in j.get("models", []) if "generateContent" in m.get("supportedGenerationMethods", [])]
          print("MODELS:", " ".join(sorted(n for n in names if "flash" in n or "pro" in n)))
          PY
