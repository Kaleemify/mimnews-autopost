name: gemini-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Call Gemini once (prints status only, never the key)
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get("GEMINI_API_KEY", "")
          model = os.environ.get("GEMINI_MODEL") or "gemini-2.5-flash"
          print("key present:", bool(key), "| length:", len(key), "| model:", model)
          body = {"contents": [{"parts": [{"text": "Write one short Pinglish (Roman Urdu) news headline about rain in Karachi. Reply with the headline only."}]}]}
          req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent", data=json.dumps(body).encode(), headers={"Content-Type": "application/json", "x-goog-api-key": key})
          try:
              r = urllib.request.urlopen(req, timeout=60); j = json.load(r)
              print("HTTP", r.status); print("ANSWER:", j["candidates"][0]["content"]["parts"][0]["text"].strip()[:200])
          except urllib.error.HTTPError as e:
              msg = e.read().decode()[:400]
              print("HTTP", e.code, "->", msg.replace(key, "<key>") if key else msg)
              raise SystemExit(1)
          PY
